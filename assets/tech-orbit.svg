<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320">
    <rect width="1200" height="320" rx="12" fill="#172321"/>
    
    <!-- Central Pulsing Core -->
    <g transform="translate(600, 160)">
      <circle r="45" fill="#F26938" opacity="0.15">
        <animate attributeName="r" values="40;55;40" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.15;0.35;0.15" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle r="32" fill="#F26938"/>
      <text y="5" text-anchor="middle" fill="#ffffff" font-family="DM Mono" font-size="14" font-weight="bold">CORE</text>
    </g>

    <!-- Inner Orbit Line & Group -->
    <circle cx="600" cy="160" r="110" fill="none" stroke="#B8E0C2" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.5"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 600 160" to="360 600 160" dur="18s" repeatCount="indefinite"/>
      <g transform="translate(710.0, 160.0)">
      <circle r="22" fill="#172321" stroke="#F26938" stroke-width="2"/>
      <text y="4" text-anchor="middle" fill="#B8E0C2" font-family="DM Mono" font-size="11" font-weight="bold">Java</text>
    </g><g transform="translate(600.0, 270.0)">
      <circle r="22" fill="#172321" stroke="#F26938" stroke-width="2"/>
      <text y="4" text-anchor="middle" fill="#B8E0C2" font-family="DM Mono" font-size="11" font-weight="bold">Type</text>
    </g><g transform="translate(490.0, 160.0)">
      <circle r="22" fill="#172321" stroke="#F26938" stroke-width="2"/>
      <text y="4" text-anchor="middle" fill="#B8E0C2" font-family="DM Mono" font-size="11" font-weight="bold">Reac</text>
    </g><g transform="translate(600.0, 50.0)">
      <circle r="22" fill="#172321" stroke="#F26938" stroke-width="2"/>
      <text y="4" text-anchor="middle" fill="#B8E0C2" font-family="DM Mono" font-size="11" font-weight="bold">Next</text>
    </g>
    </g>

    <!-- Outer Orbit Line & Group -->
    <circle cx="600" cy="160" r="180" fill="none" stroke="#F26938" stroke-width="1.5" opacity="0.4"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360 600 160" to="0 600 160" dur="26s" repeatCount="indefinite"/>
      <g transform="translate(780.0, 160.0)">
      <circle r="20" fill="#F26938" opacity="0.9"/>
      <text y="4" text-anchor="middle" fill="#ffffff" font-family="DM Mono" font-size="10" font-weight="bold">Node</text>
    </g><g transform="translate(420.0, 160.0)">
      <circle r="20" fill="#F26938" opacity="0.9"/>
      <text y="4" text-anchor="middle" fill="#ffffff" font-family="DM Mono" font-size="10" font-weight="bold">Dock</text>
    </g>
    </g>

    <!-- Labels & Title -->
    <text x="60" y="70" fill="#B8E0C2" font-family="DM Mono" font-size="12" letter-spacing="4">SYSTEM ARCHITECTURE</text>
    <text x="60" y="115" fill="#ffffff" font-family="sans-serif" font-size="32" font-weight="bold">Interactive Tech Orbit</text>
    <path d="M60 135 h220" stroke="#F26938" stroke-width="3"/>
  </svg>