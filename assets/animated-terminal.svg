<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240">
    <rect width="1200" height="240" rx="10" fill="#0d1117" stroke="#F26938" stroke-width="1.5"/>
    
    <!-- Window Topbar Buttons -->
    <g transform="translate(25, 20)">
      <circle cx="0" cy="0" r="6" fill="#ff5f56"/>
      <circle cx="18" cy="0" r="6" fill="#ffbd2e"/>
      <circle cx="36" cy="0" r="6" fill="#27c93f"/>
      <text x="70" y="4" fill="#8b949e" font-family="DM Mono" font-size="12">zsh — profile-terminal ~ 80x24</text>
    </g>
    <line x1="0" y1="42" x2="1200" y2="42" stroke="#21262d" stroke-width="1"/>

    <!-- Terminal Prompt Lines -->
    <g transform="translate(30, 80)" font-family="DM Mono" font-size="15">
      <text fill="#F26938">⚡ ~/dev <tspan fill="#8b949e">on</tspan> <tspan fill="#B8E0C2">main</tspan> <tspan fill="#ffffff">$ cat headline.ts</tspan></text>
      <text y="35" fill="#B8E0C2" font-weight="500">" I make thoughtful tools for noisy problems. "</text>
      
      <text y="75" fill="#F26938">⚡ ~/dev <tspan fill="#8b949e">on</tspan> <tspan fill="#B8E0C2">main</tspan> <tspan fill="#ffffff">$ echo $STATUS</tspan></text>
      <text y="110" fill="#e6edf3">Hey 👋📣,  Firstly I am 😊 in the profile 🤷, I was born in 19s, since you are not bo<tspan fill="#F26938">_</tspan></text>
    </g>

    <!-- Blinking Caret Animation -->
    <rect x="780" y="177" width="9" height="18" fill="#F26938">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </svg>